spring.application.name=comprobante-service
server.port=9095

# Base de datos
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:3306/bd_comprobante?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Liquibase administra las tablas; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Comunicacion con otros microservicios
api.movimiento=http://movimiento-service:9093/interno/movimientos/{id}

# Comprobantes: maximo 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=20MB
