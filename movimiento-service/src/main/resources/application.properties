spring.application.name=movimiento-service
server.port=9093

# Base de datos
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:3306/bd_movimiento?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Liquibase administra las tablas; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Comunicacion con otros microservicios
api.reserva=http://reserva-service:9092/interno/reservas/{id}
api.notificacion=http://notificacion-service:9096/interno/notificaciones
