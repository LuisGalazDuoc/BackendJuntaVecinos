spring.application.name=auth-service
server.port=9094

# Base de datos
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:3306/bd_usuario?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Liquibase administra las tablas; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Seguridad: misma clave que validan el gateway y los demas servicios
jwt.secret=${SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
